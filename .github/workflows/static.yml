<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📊 Trading Journal Pro - Template 3 Lembar</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/fontsource-inter@5.0.0/index.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --success: #10b981;
            --success-light: #d1fae5;
            --warning: #f59e0b;
            --warning-light: #fef3c7;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #475569;
            --gradient-1: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --gradient-2: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --gradient-3: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-dark);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        .header {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            border: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-top: 4px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--gradient-1);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4);
        }

        .btn-secondary {
            background: var(--bg-input);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .tab {
            padding: 14px 28px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            color: var(--text-secondary);
        }

        .tab:hover {
            background: var(--bg-input);
            color: var(--text-primary);
        }

        .tab.active {
            background: var(--gradient-1);
            color: white;
            border-color: transparent;
        }

        .tab-icon {
            margin-right: 8px;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Cards */
        .card {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* KPI Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .kpi-card {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .kpi-label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .kpi-value {
            font-size: 28px;
            font-weight: 700;
        }

        .kpi-value.positive {
            color: var(--success);
        }

        .kpi-value.negative {
            color: var(--danger);
        }

        .kpi-value.neutral {
            color: var(--text-primary);
        }

        .kpi-change {
            font-size: 12px;
            margin-top: 8px;
        }

        .kpi-change.up {
            color: var(--success);
        }

        .kpi-change.down {
            color: var(--danger);
        }

        /* Table */
        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        th {
            background: var(--bg-input);
            padding: 14px 12px;
            text-align: left;
            font-weight: 600;
            color: var(--text-secondary);
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.1);
        }

        /* Conditional Formatting Classes */
        .risk-low {
            background: var(--success-light) !important;
            color: #065f46;
        }

        .risk-medium {
            background: var(--warning-light) !important;
            color: #92400e;
        }

        .risk-high {
            background: var(--danger-light) !important;
            color: #991b1b;
        }

        .rrr-good {
            background: var(--success-light) !important;
            color: #065f46;
        }

        .rrr-bad {
            background: var(--danger-light) !important;
            color: #991b1b;
        }

        .checklist-yes {
            background: var(--success-light) !important;
            color: #065f46;
            font-weight: 600;
        }

        .checklist-no {
            background: var(--danger-light) !important;
            color: #991b1b;
        }

        .profit-positive {
            color: var(--success);
            font-weight: 600;
        }

        .profit-negative {
            color: var(--danger);
            font-weight: 600;
        }

        /* Form Elements */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-secondary);
        }

        .form-input, .form-select {
            padding: 12px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-input:focus, .form-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .form-input::placeholder {
            color: var(--text-secondary);
        }

        /* Checklist */
        .checklist-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 16px;
        }

        .checklist-section {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
        }

        .checklist-section-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checklist-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .checklist-item:last-child {
            border-bottom: none;
        }

        .checklist-checkbox {
            width: 22px;
            height: 22px;
            border-radius: 6px;
            border: 2px solid var(--border);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
            margin-top: 2px;
        }

        .checklist-checkbox.checked {
            background: var(--success);
            border-color: var(--success);
        }

        .checklist-checkbox.checked::after {
            content: '✓';
            color: white;
            font-weight: 700;
        }

        .checklist-label {
            font-size: 14px;
            color: var(--text-primary);
        }

        .checklist-progress {
            margin-top: 20px;
            padding: 16px;
            background: var(--bg-card);
            border-radius: 12px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: var(--bg-input);
            border-radius: 6px;
            overflow: hidden;
            margin: 12px 0;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-1);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .trade-status {
            padding: 16px 32px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 18px;
            margin-top: 16px;
            text-align: center;
        }

        .trade-status.ready {
            background: var(--success);
            color: white;
        }

        .trade-status.not-ready {
            background: var(--danger);
            color: white;
        }

        /* Charts Grid */
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 24px;
        }

        .chart-container {
            background: var(--bg-input);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border);
            height: 350px;
        }

        .chart-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-card);
            border-radius: 16px;
            padding: 32px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid var(--border);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .modal-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            padding: 4px;
        }

        .modal-close:hover {
            color: var(--text-primary);
        }

        /* Badge */
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-buy {
            background: var(--success-light);
            color: #065f46;
        }

        .badge-sell {
            background: var(--danger-light);
            color: #991b1b;
        }

        /* Tooltip */
        .tooltip {
            position: relative;
            cursor: help;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-dark);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 100;
            border: 1px solid var(--border);
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Alert */
        .alert {
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .alert-warning {
            background: var(--warning-light);
            color: #92400e;
            border: 1px solid var(--warning);
        }

        .alert-success {
            background: var(--success-light);
            color: #065f46;
            border: 1px solid var(--success);
        }

        .alert-danger {
            background: var(--danger-light);
            color: #991b1b;
            border: 1px solid var(--danger);
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-dark);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
            }

            .header-actions {
                justify-content: center;
            }

            .tabs {
                justify-content: center;
            }

            .tab {
                padding: 12px 20px;
                font-size: 13px;
            }

            .kpi-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .checklist-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-in {
            animation: fadeIn 0.5s ease forwards;
        }

        /* Stats Summary */
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-item {
            text-align: center;
            padding: 16px;
            background: var(--bg-input);
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-input {
            padding: 10px 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .filter-input:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header animate-in">
            <div>
                <h1>📊 Trading Journal Pro</h1>
                <p class="header-subtitle">Template 3 Lembar - Trade Log, Dashboard, Checklist</p>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" onclick="openAddTradeModal()">
                    <span>➕</span> Tambah Trade
                </button>
                <button class="btn btn-secondary" onclick="exportData()">
                    <span>📥</span> Export
                </button>
                <button class="btn btn-secondary" onclick="importData()">
                    <span>📤</span> Import
                </button>
                <button class="btn btn-danger" onclick="clearAllData()">
                    <span>🗑️</span> Reset
                </button>
            </div>
        </header>

        <!-- Tabs -->
        <div class="tabs animate-in">
            <div class="tab active" onclick="switchTab('trade-log')">
                <span class="tab-icon">📋</span>Trade Log
            </div>
            <div class="tab" onclick="switchTab('dashboard')">
                <span class="tab-icon">📈</span>Dashboard
            </div>
            <div class="tab" onclick="switchTab('checklist')">
                <span class="tab-icon">✅</span>Checklist Pre-Trade
            </div>
        </div>

        <!-- Tab 1: Trade Log -->
        <div id="trade-log" class="tab-content active">
            <div class="card animate-in">
                <div class="filter-bar">
                    <input type="text" class="filter-input" placeholder="🔍 Cari Trade ID..." id="searchTrade" onkeyup="filterTrades()">
                    <select class="filter-input" id="filterPair" onchange="filterTrades()">
                        <option value="">Semua Pair</option>
                        <option value="EUR/USD">EUR/USD</option>
                        <option value="GBP/USD">GBP/USD</option>
                        <option value="GBP/JPY">GBP/JPY</option>
                        <option value="XAU/USD">XAU/USD</option>
                        <option value="BTC/USD">BTC/USD</option>
                        <option value="USD/JPY">USD/JPY</option>
                    </select>
                    <select class="filter-input" id="filterDirection" onchange="filterTrades()">
                        <option value="">Semua Arah</option>
                        <option value="BUY">BUY</option>
                        <option value="SELL">SELL</option>
                    </select>
                    <select class="filter-input" id="filterResult" onchange="filterTrades()">
                        <option value="">Semua Hasil</option>
                        <option value="win">Profit</option>
                        <option value="loss">Loss</option>
                    </select>
                </div>

                <div class="table-container">
                    <table id="tradeTable">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Tanggal</th>
                                <th>Pair</th>
                                <th>Arah</th>
                                <th>Strategy</th>
                                <th>Entry</th>
                                <th>SL</th>
                                <th>TP</th>
                                <th>Lot</th>
                                <th>Risk (IDR)</th>
                                <th>Risk (%)</th>
                                <th>RRR</th>
                                <th>P/L (IDR)</th>
                                <th>R-Mult</th>
                                <th>Emosi</th>
                                <th>Checklist</th>
                                <th>Catatan</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tradeTableBody">
                            <!-- Data will be populated by JavaScript -->
                        </tbody>
                    </table>
                </div>

                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-state-icon">📝</div>
                    <div class="empty-state-title">Belum ada trade tercatat</div>
                    <p>Klik tombol "Tambah Trade" untuk mencatat trade pertama Anda</p>
                </div>
            </div>
        </div>

        <!-- Tab 2: Dashboard -->
        <div id="dashboard" class="tab-content">
            <!-- KPI Cards -->
            <div class="kpi-grid animate-in">
                <div class="kpi-card">
                    <div class="kpi-label">📊 Total Trade</div>
                    <div class="kpi-value neutral" id="kpiTotalTrades">0</div>
                    <div class="kpi-change">Semua waktu</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">🎯 Win Rate</div>
                    <div class="kpi-value neutral" id="kpiWinRate">0%</div>
                    <div class="kpi-change" id="kpiWinRateChange">Target: >45%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">💰 Total P/L</div>
                    <div class="kpi-value neutral" id="kpiTotalPL">Rp 0</div>
                    <div class="kpi-change">Kumulatif</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">⚠️ Avg Risk %</div>
                    <div class="kpi-value neutral" id="kpiAvgRisk">0%</div>
                    <div class="kpi-change" id="kpiAvgRiskChange">Target: ≤1%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">📈 Profit Factor</div>
                    <div class="kpi-value neutral" id="kpiProfitFactor">0</div>
                    <div class="kpi-change" id="kpiProfitFactorChange">Target: >1.5</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">✅ Kepatuhan</div>
                    <div class="kpi-value neutral" id="kpiCompliance">0%</div>
                    <div class="kpi-change" id="kpiComplianceChange">Target: >90%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">🎲 Expectancy</div>
                    <div class="kpi-value neutral" id="kpiExpectancy">Rp 0</div>
                    <div class="kpi-change">Per trade</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">📉 Max Drawdown</div>
                    <div class="kpi-value negative" id="kpiMaxDrawdown">0%</div>
                    <div class="kpi-change">Terbesar</div>
                </div>
            </div>

            <!-- Charts -->
            <div class="charts-grid animate-in">
                <div class="chart-container">
                    <div class="chart-title">📈 Equity Curve</div>
                    <canvas id="equityChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">🥧 Distribusi Emosi</div>
                    <canvas id="emotionChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">📊 Performance per Strategy</div>
                    <canvas id="strategyChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">🎯 Risk vs R-Multiple</div>
                    <canvas id="riskScatterChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">📅 Win/Loss per Hari</div>
                    <canvas id="dayChart"></canvas>
                </div>
                <div class="chart-container">
                    <div class="chart-title">⏰ Performance per Sesi</div>
                    <canvas id="sessionChart"></canvas>
                </div>
            </div>

            <!-- Weekly Summary -->
            <div class="card animate-in" style="margin-top: 24px;">
                <div class="card-title">
